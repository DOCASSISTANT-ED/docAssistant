services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docassistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Sadece volume ilk kez oluşturulurken çalışır (CREATE EXTENSION vector)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Geliştirmede Ollama doğrudan Windows'a kurulur; bu servis sadece
  # Linux + NVIDIA sunucu için:  docker compose --profile linux-gpu up -d
  ollama:
    profiles: ["linux-gpu"]
    image: ollama/ollama:latest
    container_name: docassistant-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres-data:
  ollama-data:
