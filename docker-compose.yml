services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docassistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Kısıtlı uygulama kullanıcısının (docassistant_app) parolası; init betiği okur.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Sadece volume ilk kez oluşturulurken çalışır (vector eklentisi, uygulama kullanıcısı)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 uyumlu dosya saklama (geliştirme). MinIO yerine SeaweedFS: docs/decisions.md #9
  # "mini" modu master, volume, filer ve S3 gateway'i tek süreçte çalıştırır.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: docassistant-seaweedfs
    restart: unless-stopped
    command: mini
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      - "[::1]:${S3_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
      - "[::1]:${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Geliştirmede Ollama doğrudan Windows'a kurulur; bu servis sadece
  # Linux + NVIDIA sunucu için:  docker compose --profile linux-gpu up -d
  ollama:
    profiles: ["linux-gpu"]
    image: ollama/ollama:latest
    container_name: docassistant-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
      - "[::1]:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Geliştirmede e-posta (docs/decisions.md #70). Uygulamanın SMTP ile gönderdiği e-postaları
  # kimseye göndermeden yakalar; doğrulama kodları http://localhost:8025 adresinde görünür.
  # Canlıda bunun yerine gerçek bir SMTP servisi kullanılır. E-postalar bellekte durur,
  # servis yeniden başlayınca silinir.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: docassistant-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "[::1]:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "[::1]:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reranker (docs/decisions.md #52). İsteğe bağlı, varsayılan olarak başlamaz:
  #   docker compose --profile reranker up -d
  # İlk açılışta modeli (yaklaşık 2,3 GB) indirir. Bu imaj işlemcide çalışır ve yavaştır
  # (soru başına onlarca saniye); GPU'lu sunucu imajı Faz 5'te seçilecek.
  reranker:
    profiles: ["reranker"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: docassistant-reranker
    restart: unless-stopped
    # --max-batch-tokens: 8 GB bellekli Docker'da varsayılan değerle servis bellekten düşüyor.
    command: --model-id ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3} --max-batch-tokens 2048
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8088}:80"
      - "[::1]:${RERANKER_PORT:-8088}:80"
    volumes:
      - reranker-data:/data

volumes:
  postgres-data:
  seaweedfs-data:
  ollama-data:
  reranker-data:
