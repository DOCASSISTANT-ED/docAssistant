<div class="conversation" #scroller (scroll)="onScroll()">
  <div class="column">
    @for (entry of chat.entries(); track entry.key) {
      @if (entry.kind === 'question') {
        <div class="question">
          <p class="bubble">{{ entry.text }}</p>
        </div>
      } @else {
        <app-answer [entry]="entry" [canRetry]="$last" (retry)="chat.retry()" />
      }
    }
  </div>
</div>

<form class="composer" (ngSubmit)="send()">
  <div class="composer-box">
    <textarea
      name="question"
      class="input"
      rows="1"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="8"
      placeholder="Belgelerinize bir soru sorun"
      aria-label="Sorunuz"
      [maxlength]="maxLength"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      (keydown.enter)="onEnter($event)"
    ></textarea>

    <button class="send" type="submit" aria-label="Soruyu gönder" [disabled]="!canSend()">
      <span aria-hidden="true">↑</span>
    </button>
  </div>

  @if (draft().length > maxLength - 200) {
    <p class="counter">{{ draft().length }} / {{ maxLength }}</p>
  } @else {
    <p class="hint">Cevaplar yalnızca yüklenen belgelere dayanır.</p>
  }
</form>
