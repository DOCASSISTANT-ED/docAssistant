@let current = source();

<button
  class="card"
  type="button"
  [attr.aria-pressed]="selected()"
  [attr.aria-label]="current.documentTitle + ' kaynağını göster'"
  (click)="open($event)"
>
  <span class="source-number" aria-hidden="true">{{ current.number }}</span>

  <span class="source-lines">
    <span class="source-title">{{ current.documentTitle }}</span>
    <span class="source-place">{{ place() }}</span>
  </span>

  <!-- A click opens the source beside the chat. -->
  <span class="action" aria-hidden="true">›</span>
</button>
