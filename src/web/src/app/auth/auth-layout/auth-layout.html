<div class="auth">
  <aside class="brand">
    <!-- Decoration only: slow drifting light and a few floating sheets of paper. -->
    <div class="scenery" aria-hidden="true">
      <span class="glow glow-amber"></span>
      <span class="glow glow-mint"></span>
      <span class="glow glow-deep"></span>

      <div class="sheet sheet-back">
        <span class="line w-60"></span>
        <span class="line w-90"></span>
        <span class="line w-75"></span>
        <span class="line w-40"></span>
      </div>
      <div class="sheet sheet-middle">
        <span class="line w-50"></span>
        <span class="line w-90"></span>
        <span class="line w-80"></span>
        <span class="line w-65"></span>
        <span class="line w-30"></span>
      </div>
      <div class="sheet sheet-front">
        <span class="line w-45"></span>
        <span class="line w-90"></span>
        <span class="line marked w-70"></span>
        <span class="line w-85"></span>
        <span class="badge">1</span>
      </div>
    </div>

    <div class="brand-name">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>DocAssistant</span>
    </div>

    <div class="brand-message">
      <p class="brand-tagline">
        Belgelerinize sorun,<br />
        <span class="underlined">kaynağıyla</span> cevap alın.
      </p>
      <p class="brand-description">
        Şirket belgeleriniz tek yerde. Her cevap, dayandığı belgeyi ve sayfayı gösterir.
      </p>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner">
      <ng-content />
    </div>
  </main>
</div>
